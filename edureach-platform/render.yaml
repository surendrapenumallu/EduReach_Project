services:
  # Backend API Web Service
  - type: web
    name: edureach-server
    env: node
    rootDir: edureach-platform/server
    buildCommand: npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 5050
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false

  # Frontend Static Site
  - type: web
    name: edureach-client
    env: static
    rootDir: edureach-platform/client
    buildCommand: npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
